# AradEx-Backend: docker build (Dockerfile-ul din repo, neschimbat) -> ECR -> imagedefinitions.json pentru deploy-ul ECS.
version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      # Imaginile de bază din oglinda ECR Public, etichetate cu numele din Dockerfile (docker build fără pull le folosește local).
      - docker pull public.ecr.aws/docker/library/gradle:8.14-jdk21
      - docker tag public.ecr.aws/docker/library/gradle:8.14-jdk21 gradle:8.14-jdk21
      - docker pull public.ecr.aws/docker/library/eclipse-temurin:21-jre
      - docker tag public.ecr.aws/docker/library/eclipse-temurin:21-jre eclipse-temurin:21-jre
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-12)
  build:
    # Push-ul stă tot în build: un build eșuat nu ajunge niciodată în ECR.
    commands:
      - docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" -t "$ECR_REPOSITORY_URL:latest" .
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - docker push "$ECR_REPOSITORY_URL:latest"
      - printf '[{"name":"api","imageUri":"%s"}]' "$ECR_REPOSITORY_URL:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
