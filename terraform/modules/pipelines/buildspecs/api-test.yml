# AradEx-Backend: ./gradlew test (api + app), inclusiv AppSmokeTest cu Testcontainers (Docker în CodeBuild privilegiat).
version: 0.2

env:
  variables:
    # Imaginile Testcontainers (postgres) vin din oglinda ECR Public, nu din Docker Hub (limită de rată).
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
    TESTCONTAINERS_RYUK_DISABLED: "true"

phases:
  install:
    runtime-versions:
      java: corretto21
  build:
    commands:
      - chmod +x gradlew
      - ./gradlew test --no-daemon

reports:
  junit:
    files:
      - "**/build/test-results/test/*.xml"
    file-format: JUNITXML

cache:
  paths:
    - /root/.gradle/caches/**/*
    - /root/.gradle/wrapper/**/*
