# AradEx-Frontend: build Vite (PWA) -> S3 -> invalidare CloudFront. Totul în faza build: un build eșuat nu publică nimic.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  build:
    commands:
      - npm ci
      - npm run build
      # Fișierele cu hash: cache lung. Nu ștergem asset-urile vechi (tab-urile deschise le mai cer).
      - aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
      # Restul (img, fonturi, icon-uri): cache scurt; fișierele PWA critice sunt excluse aici și urcate mai jos cu no-cache.
      - >-
        aws s3 sync dist "s3://$BUCKET" --delete
        --exclude "assets/*" --exclude "index.html" --exclude "sw.js" --exclude "registerSW.js"
        --exclude "manifest.webmanifest" --exclude "workbox-*.js"
        --cache-control "public, max-age=3600"
      # PWA: index.html, service worker-ul și manifestul nu se țin în cache, ca update-ul să ajungă imediat.
      - for f in index.html sw.js registerSW.js; do if [ -f "dist/$f" ]; then aws s3 cp "dist/$f" "s3://$BUCKET/$f" --cache-control "no-cache"; fi; done
      - if [ -f dist/manifest.webmanifest ]; then aws s3 cp dist/manifest.webmanifest "s3://$BUCKET/manifest.webmanifest" --cache-control "no-cache" --content-type "application/manifest+json"; fi
      - aws s3 cp dist "s3://$BUCKET" --recursive --exclude "*" --include "workbox-*.js" --cache-control "no-cache"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

cache:
  paths:
    - /root/.npm/**/*
